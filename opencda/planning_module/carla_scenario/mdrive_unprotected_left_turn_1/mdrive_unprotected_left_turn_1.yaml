name: mdrive_unprotected_left_turn_1
runner_module: planning_runner
carla:
  host: 127.0.0.1
  port: 2000
  timeout_s: 30.0
  synchronous_mode: true
  launch_if_needed: true
  launch_timeout_s: 120.0
  carla_root: /home/umd-user/carla_source/carla
  launch_mode: ue4editor_map
  rhi: -vulkan
  launch_extra_args:
  - -quality-level=Low
  - -ResX=800
  - -ResY=600
  map: /Game/Carla/Maps/Town05
anchors:
  ego_spawn: mdrive_unprotected_left_turn_1_ego
  final_destination: mdrive_unprotected_left_turn_1_final_destination
  ego_spawn_xyz_yaw:
  - -173.802
  - 91.368
  - 0.0
  - 0.057296
  final_destination_xyz_yaw:
  - -124.475
  - 27.894
  - 0.0
  - -90.515734
ego:
  blueprint: vehicle.tesla.model3
  role_name: ego
  color_rgb: 255,0,0
  spawn_z_offset_m: 1.0
constraints:
  min_velocity_mps: 0.0
  max_velocity_mps: 10.0
  min_acceleration_mps2: -10.0
  max_acceleration_mps2: 3.0
  max_jerk_mps3: 10.0
  min_steer_rad: -0.6
  max_steer_rad: 0.6
  min_steer_rate_rps: -0.2
  max_steer_rate_rps: 0.2
  enforce_terminal_velocity_constraint: true
  terminal_velocity_mps: 0.0
planning:
  waypoint_sample_distance_m: 3.0
  prompt_period_s: 1.0
  global_planner_mode: astar
runtime:
  module: utility.coordinate_obstacle_spawner
  traffic_light_stop:
    enabled: false
  traffic_light_stop_waypoint_match_distance_m: 8.0
  traffic_light_actor_position_match_distance_m: 28.0
  traffic_light_actor_position_lateral_m: 4.5
# NOTE (use case B fix): this scenario previously had no `obstacles` block at
# all -- ego drove the left-turn route with nothing to turn across, so the
# "unprotected left turn" conflict the scenario name implies never actually
# existed. The vehicle below drives the opposing direction (yaw 180 deg) past
# ego's turn point using follow_mode: literal (see
# `utility/coordinate_obstacle_spawner.py::_step_vehicle_along_waypoints`), so
# ego has to judge a gap in real oncoming traffic before completing the turn.
# The turn point is inferred from the ego anchors (roughly x=-124.5,
# y=91.4, based on `final_destination_xyz_yaw`'s x combined with
# `ego_spawn_xyz_yaw`'s y); the oncoming lane's exact lateral offset
# (guessed here as +3.5 m from ego's approach y) and the timing/speed needed
# for the two vehicles to actually meet at the intersection are NOT verified
# against a live CARLA session -- confirm and retune once run in the
# simulator.
obstacles:
  spawner_module: utility.coordinate_obstacle_spawner
  npc_vehicles:
    - role_name: oncoming_left_turn_traffic
      blueprint: vehicle.tesla.model3
      color_rgb: "40,40,180"
      follow_mode: literal
      speed_mps: 8.0
      arrival_threshold_m: 3.0
      waypoints:
        - [-64.475, 94.868, 0.6, 180.0]
        - [-160.0, 94.868, 0.6, 180.0]
camera:
  enabled: true
  image_size_x: 640
  image_size_y: 480
  fov: 90.0
  hud_position: bottom
  hud_panel_height_px: 220
  topdown:
    world_fixed: false
    height: 65.0
    padding_m: 20.0
  chase:
    back: 8.0
    height: 2.8
    pitch: -10.0
