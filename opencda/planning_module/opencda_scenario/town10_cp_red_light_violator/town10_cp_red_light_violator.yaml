name: town10_cp_red_light_violator
runner_module: opencda_scenario.runner

carla:
  host: 127.0.0.1
  port: 2000
  timeout_s: 30.0
  synchronous_mode: true
  launch_if_needed: true
  launch_timeout_s: 120.0
  carla_root: /home/umd-user/carla_source/carla
  launch_mode: ue4editor_map
  rhi: -vulkan
  launch_extra_args:
    - "-quality-level=Low"
    - "-ResX=800"
    - "-ResY=600"
  map: /Game/Carla/Maps/Town10HD_Opt

sumo:
  enabled: true
  connect_existing_server: false
  host: 127.0.0.1
  port: 8813
  gui: false
  client_order: 1
  step_length: 0.05
  carla_sync_radius_m: 120.0
  carla_despawn_radius_m: 140.0
  carla_sync_max_actors: 50
  map_basename: Town10HD_Opt
  asset_root: opencda_scenario/assets
  auto_generate_assets: true
  xodr_path: /home/umd-user/carlaCache/Carla/Maps/OpenDrive/Town10HD_Opt.xodr
  route_generation:
    seed: 42
    period_s: 0.75
    end_time_s: 3600.0
    fringe_factor: 8.0
    random_depart_lane: true
    random_depart_speed: true
    validate: true
    force_regenerate: false

anchors:
  ego_spawn_xyz_yaw: [-113.404, -35.0, 0.6, 90.0]
  final_destination_xyz_yaw: [109.523, 89.837, 0.6, 0.0]

traffic_manager:
  enabled: true
  port: 8000
  synchronous_mode: true

runtime:
  module: utility.coordinate_obstacle_spawner

# NOTE (use case A fix): the vehicle below is spawned with follow_mode: literal,
# which drives it along explicit waypoints via a simple point-to-point
# controller that has no concept of traffic lights or right-of-way at all (see
# `utility/coordinate_obstacle_spawner.py::_step_vehicle_along_waypoints`). It
# therefore *actually* drives straight through the intersection regardless of
# signal state -- a real red-light violation -- instead of the previous
# `marker_vehicle_mode: autopilot` placement, which just made it a normal,
# law-abiding CARLA Traffic Manager vehicle that would never run a light.
# Waypoints/speed below are a best-effort placement based on the original
# marker position (`-132.0, -4.5`, yaw 0 deg / +X) and were not verified
# against a live CARLA session -- confirm the crossing geometry and re-tune
# `speed_mps`/timing once run in the simulator.
obstacles:
  spawner_module: utility.coordinate_obstacle_spawner
  cooperative_message_trigger_distance_m: 60.0
  npc_vehicles:
    - role_name: cp_cross_traffic_risk
      blueprint: vehicle.tesla.model3
      color_rgb: "40,80,180"
      follow_mode: literal
      speed_mps: 8.0
      arrival_threshold_m: 3.0
      waypoints:
        - [-132.0, -4.5, 0.6, 0.0]
        - [-92.0, -4.5, 0.6, 0.0]

cp_scenario:
  use_case: A
  description: >-
    A cross-traffic vehicle drives straight through the intersection
    regardless of signal state, simulating a potential red-light violator
    that shared perception can warn ego about before ego's own perception
    would otherwise detect it.

ego:
  blueprint: vehicle.tesla.model3
  role_name: ego
  color_rgb: "255,0,0"
  spawn_z_offset_m: 1.0

constraints:
  min_velocity_mps: 0.0
  max_velocity_mps: 10.0
  min_acceleration_mps2: -10.0
  max_acceleration_mps2: 3.0
  max_jerk_mps3: 10.0
  min_steer_rad: -0.6
  max_steer_rad: 0.6
  min_steer_rate_rps: -0.2
  max_steer_rate_rps: 0.2
  enforce_terminal_velocity_constraint: true
  terminal_velocity_mps: 0.0

planning:
  waypoint_sample_distance_m: 3.0
  prompt_period_s: 1.0

camera:
  enabled: true
  image_size_x: 840
  image_size_y: 680
  fov: 90.0
  topdown:
    world_fixed: false
    height: 65.0
    padding_m: 20.0
  chase:
    back: 8.0
    height: 2.8
    pitch: -10.0

