name: town10_cp_passing_merge
runner_module: opencda_scenario.runner

carla:
  host: 127.0.0.1
  port: 2000
  timeout_s: 30.0
  synchronous_mode: true
  launch_if_needed: true
  launch_timeout_s: 120.0
  carla_root: /home/umd-user/carla_source/carla
  launch_mode: ue4editor_map
  rhi: -vulkan
  launch_extra_args:
    - "-quality-level=Low"
    - "-ResX=800"
    - "-ResY=600"
  map: /Game/Carla/Maps/Town10HD_Opt

sumo:
  enabled: true
  connect_existing_server: false
  host: 127.0.0.1
  port: 8813
  gui: false
  client_order: 1
  step_length: 0.05
  carla_sync_radius_m: 120.0
  carla_despawn_radius_m: 140.0
  carla_sync_max_actors: 60
  map_basename: Town10HD_Opt
  asset_root: opencda_scenario/assets
  auto_generate_assets: true
  xodr_path: /home/umd-user/carlaCache/Carla/Maps/OpenDrive/Town10HD_Opt.xodr
  route_generation:
    seed: 42
    period_s: 0.75
    end_time_s: 3600.0
    fringe_factor: 8.0
    random_depart_lane: true
    random_depart_speed: true
    validate: true
    force_regenerate: false

anchors:
  ego_spawn_xyz_yaw: [-85.0, -60.0, 0.6, 90.0]
  final_destination_xyz_yaw: [65.0, 128.0, 0.6, 0.0]

traffic_manager:
  enabled: true
  port: 8000
  synchronous_mode: true

runtime:
  module: opencda_scenario.cp_scenarios
  cp_message_schema_version: 1
  cp_message_prefix: town10_cp_passing_merge
  reset_cp_message_file: true
  marker_vehicle_mode: autopilot
  spawn_fallback_npc_when_no_markers: true
  obstacle_message_distance_m: 140.0
  obstacle_prediction_horizon_s: 5.0
  traffic_light_stop:
    enabled: true
    search_distance_m: 80.0
    stop_buffer_m: 2.0
  vehicle_blueprint: vehicle.tesla.model3
  vehicle_color_rgb: "80,80,180"

cp_scenario:
  use_case: E
  description: Shared perception reports adjacent-lane and merging vehicles so behavior planner can evaluate pass/merge gaps early.
  vehicles:
    - index: 1
      name: cp_adjacent_approaching_vehicle
      type: adjacent_lane_gap_vehicle
      description: Vehicle in adjacent lane used for pass-gap awareness.
      xyz_yaw: [-81.5, -32.0, 0.6, 90.0]
    - index: 2
      name: cp_merge_lead_vehicle
      type: converging_lane_vehicle
      description: Vehicle ahead near merge/passing target lane.
      xyz_yaw: [-84.8, -18.0, 0.6, 90.0]

ego:
  blueprint: vehicle.tesla.model3
  role_name: ego
  color_rgb: "255,0,0"
  spawn_z_offset_m: 1.0

constraints:
  min_velocity_mps: 0.0
  max_velocity_mps: 10.0
  min_acceleration_mps2: -10.0
  max_acceleration_mps2: 3.0
  max_jerk_mps3: 10.0
  min_steer_rad: -0.6
  max_steer_rad: 0.6
  min_steer_rate_rps: -0.2
  max_steer_rate_rps: 0.2
  enforce_terminal_velocity_constraint: true
  terminal_velocity_mps: 0.0

planning:
  waypoint_sample_distance_m: 3.0
  prompt_period_s: 1.0

camera:
  enabled: true
  image_size_x: 840
  image_size_y: 680
  fov: 90.0
  topdown:
    world_fixed: false
    height: 65.0
    padding_m: 20.0
  chase:
    back: 8.0
    height: 2.8
    pitch: -10.0

