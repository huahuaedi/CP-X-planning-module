        route_tracking_lane_change_max_lane_center_fraction: 0.70
        route_tracking_lane_change_max_boundary_failures: 1
        full_lane_change_reference_duplicate_spacing_m: 0.05
        route_tracking_turn_activation_distance_m: 18.0
        route_tracking_obstacle_additional_buffer_m: 3.0
        full_candidate_reference_min_object_distance_m: 2.0
        full_intersection_turn_prepare_enabled: true
