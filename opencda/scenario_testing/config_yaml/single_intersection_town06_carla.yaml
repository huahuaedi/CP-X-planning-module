description: |-
  Town06 urban traffic-light test. The ego follows the southbound arterial
  through three signalized intersections while CARLA Traffic Manager provides
  surrounding traffic. The destination is beyond the third traffic light and
  before the later turning region.

# First define the basic parameters of the vehicles
vehicle_base:
  sensing:
    perception:
      # --apply_ml enables YOLOv5 detection. One frontal RGB camera is fused
      # with LiDAR to produce 3D obstacle states for the CP-X planner.
      activate: true
      camera:
        # Keep the CP-X HUD as the only window. Set this to 1 temporarily when
        # the detector image itself needs to be inspected.
        visualize: 0
        num: 1
        # relative positions (x,y,z,yaw) of the camera. len(positions) should be equal to camera num
        positions:
          - [2.5, 0, 1.0, 0]
      lidar:
        visualize: false
  map_manager:
    visualize: false
    activate: false
  behavior:
    max_speed: 50 # maximum speed, km/h
    ignore_traffic_light: false # whether to ignore traffic light
    collision_time_ahead: 2.0 # used for collision checking
  planner:
    enabled: true
    type: cpx_mpc
    mode: full_cpx_mpc
    architecture_profile: unified_full_v2
    fallback_policy: emergency_stop
    safety_supervisor_enabled: true
    safety_max_steer_delta: 0.25
    safety_max_throttle_delta: 0.45
    safety_max_brake_delta: 0.60
    safety_stuck_release_min_accel_mps2: 0.01
    use_opencda_global_route: true
    opencda_global_route_reference_allowed: true
    # CARLA-native GlobalRoutePlanner (route_manager.py's _build_route)
    # is already the primary source for road-option/macro-maneuver lookups
    # and reference geometry whenever it has a route (geometry_route_points()
    # prefers it explicitly) -- self.global_planner (this setting) only
    # matters as a fallback and for its road_cfg_from_map lane-width output.
    # "dij" (AD-map) parses the xodr independently of CARLA's own map, which
    # can disagree with CARLA's topology exactly at junctions/lane-change
    # boundaries -- that mismatch was the root cause behind three separate
    # stuck-vehicle bugs this session (lane-change reference, route-point
    # gap, lane-id renumbering). "astar" builds its fallback lane geometry
    # directly from the loaded CARLA map, so it can't disagree with it.
    global_planner_mode: astar
    global_planner_xodr_path: Global_Planner/maps/Town06.xodr
    global_planner_strict: false
    publish_cp_message: true
    require_native_opencda_cp: true
    # Reverted to the historical default (3.0) after the 35mph (15.6464)
    # test stage. The lane-change/turn caps, curvature-adaptive turn speed
    # cap, throttle ceilings, and missed-lane-change replan trigger added
    # during that test stage all stay in place -- they don't depend on this
    # cruise value and are non-binding (higher than cruise) at 3.0.
    target_speed_mps: 3.0
    # Safe baseline: track a near-term feasible MPC velocity. A terminal
    # horizon state is not a current actuator command and caused overspeed.
    mpc_velocity_command_source: preview
    mpc_velocity_command_preview_time_s: 0.6
    # MPC outputs physical acceleration, while CARLA accepts normalized pedal
    # positions. This inverse-actuator model compensates steady-state drag and
    # uses measured acceleration as the MPC feedback state.
    actuator_compensation_enabled: true
    actuator_cruise_throttle_feedforward: 0.28
    # Retained for the legacy acceleration-to-pedal fallback path; normal
    # velocity tracking is now owned by OpenCDA's longitudinal PID.
    actuator_cruise_max_throttle: 0.85
    actuator_speed_error_throttle_gain: 0.05
    actuator_max_speed_error_throttle_boost: 0.20
    actuator_speed_deadband_mps: 0.15
    actuator_tracking_brake_decel_per_unit_mps2: 14.0
    actuator_stop_brake_decel_per_unit_mps2: 10.0
    actuator_tracking_max_brake: 0.22
    actuator_stop_max_brake: 0.35
    actuator_max_measured_accel_abs_mps2: 3.0
    control_buffer_speed_crossing_deadband_mps: 0.15
    # CARLA junction topology can contain tiny non-projecting waypoint seams.
    # Tolerate only a small fraction of failed swept poses; broad or sustained
    # off-road references remain hard-gated.
    turn_drivable_union_seam_max_pose_violations: 3
    turn_drivable_union_seam_max_violation_ratio: 0.10
    actuator_measured_accel_alpha: 0.25
    lookahead_m: 18.0
    min_front_gap_m: 8.0
    communication_range_m: 60.0
    max_mpc_obstacles: 4
    route_reached_distance_m: 1.0
    tracker_max_stale_s: 0.5
    tracker_max_speed_mps: 45.0
    tracker_max_acceleration_mps2: 12.0
    tracker_max_position_jump_m: 12.0
    mpc_feedback_enabled: true
    mpc_feedback_hold_s: 1.5
    mpc_feedback_min_failures: 1
    mpc_feedback_candidate_weight: 80.0
    control_buffer_enabled: true
    control_buffer_max_reuse_s: 0.35
    overspeed_guard_enabled: false
    overspeed_margin_mps: 0.5
    overspeed_release_margin_mps: 0.1
    overspeed_decel_gain: 0.8
    overspeed_max_decel_mps2: 0.8
    lane_follow_negative_accel_release_enabled: false
    lane_follow_negative_accel_release_error_mps: 0.05
    lane_follow_negative_accel_release_min_front_gap_m: 12.0
    full_traffic_green_confirm_s: 0.15
    full_traffic_hold_stop_unknown_until_green: false
    full_stop_hold_speed_mps: 0.10
    full_stop_hold_brake: 0.60
    normal_stop_mpc_suspend_speed_mps: 0.30
    normal_stop_mpc_suspend_brake: 0.08
    lane_follow_speed_recovery_enabled: false
    lane_follow_speed_recovery_enter_error_mps: 0.20
    lane_follow_speed_recovery_release_error_mps: 0.05
    lane_follow_speed_recovery_min_accel_mps2: 0.80
    lane_follow_speed_recovery_max_lateral_m: 0.50
    # Disabled: steers toward destination_state while nearly stationary, but
    # that steering input itself perturbs destination_state (noisy at low
    # speed), producing a positive-feedback oscillation -- confirmed via
    # yaw_deg swinging +/-15 deg and speed cycling 0-4 m/s in debug CSVs.
    # Matches cpx_profile_full_default.yaml's setting for the same reason.
    low_speed_lateral_recovery_enabled: false
    low_speed_lateral_recovery_speed_mps: 0.8
    low_speed_lateral_recovery_threshold_m: 1.2
    low_speed_lateral_recovery_target_speed_mps: 1.0
    low_speed_lateral_recovery_max_steer_rad: 0.18
    full_lane_change_start_lock_s: 8.0
    full_dense_traffic_lane_change_lock_enabled: false
    full_dense_traffic_object_count: 8
    full_dense_traffic_risky_lane_count: 2
    full_prepare_lane_change_reference_lock: true
    full_allow_opportunistic_lane_change: false
    route_lane_change_preparation_start_distance_m: 45.0
    route_lane_change_latest_start_distance_m: 12.0
    route_lane_change_target_safety_threshold: 0.65
    route_lane_change_require_adjacent: true
    full_lane_follow_max_destination_lateral_m: 1.2
    full_lane_follow_max_reference_first_lateral_m: 0.65
    full_stop_max_destination_lateral_m: 1.0
    full_stop_max_reference_first_lateral_m: 0.55
    full_stop_guard_destination_forward_m: 6.0
    full_mpc_reference_stabilizer_enabled: true
    full_candidate_pipeline_enabled: true
    human_like_lane_change_enabled: true
    human_lane_change_min_duration_s: 3.0
    human_lane_change_max_duration_s: 6.5
    route_tracking_rejoin_distance_m: 7.0
    route_tracking_destination_arc_m: 8.0
    route_tracking_destination_horizon_fraction: 0.9
    route_tracking_min_step_m: 0.10
    route_tracking_lane_change_duration_s: 4.0
    route_tracking_lane_change_direct_target_tracking_enabled: false
    route_tracking_lane_change_road_envelope_enabled: false
    route_tracking_lane_change_duration_comfort_check_enabled: true
    route_tracking_recovery_heading_error_deg: 25.0
    route_tracking_recovery_speed_mps: 1.0
    route_tracking_recovery_rejoin_distance_m: 10.0
    route_tracking_lane_change_max_curvature_1pm: 0.35
    route_tracking_lane_change_max_heading_jump_rad: 0.35
    route_tracking_lane_change_max_lane_center_fraction: 0.70
    route_tracking_lane_change_max_boundary_failures: 1
    full_lane_change_reference_duplicate_spacing_m: 0.05
    route_tracking_turn_activation_distance_m: 18.0
    route_tracking_obstacle_additional_buffer_m: 3.0
    full_candidate_reference_min_object_distance_m: 2.0
    candidate_lane_change_defer_cost: 10.0
    full_intersection_turn_prepare_enabled: true
    full_intersection_turn_prepare_lookahead_m: 22.0
    full_intersection_turn_prepare_min_m: 3.0
    # One longitudinal contract for the complete turn pipeline.  The AD-map
    # connector is sampled for 2.2 m/s below, so entering/tracking it at the
    # old 5.0 m/s ceiling made the vehicle demand excessive lateral
    # acceleration on Town06's tight connector.  PREPARE_TURN uses the
    # ScenarioManager key explicitly and sheds speed before geometry ownership
    # transfers to the connector.
    full_intersection_turn_speed_cap_mps: 2.2
    scenario_turn_prepare_speed_cap_mps: 2.8
    turn_approach_comfort_decel_mps2: 2.5
    turn_approach_entry_buffer_m: 5.0
    turn_approach_preview_margin_m: 10.0
    # Fixed, cruise-independent lane-change speed ceiling: raising cruise
    # speed must not raise this. At 15.0 it sat almost level with the 35mph
    # (15.6464 m/s) cruise target, so lane changes were attempted at ~14 m/s
    # and never had enough distance/time to complete. 3.0 completed reliably
    # but produced a hard step-drop from cruise once cruise could actually
    # reach 7-15 m/s (the throttle ceiling fix let real speed get there);
    # raised toward a value that still completes reliably while cutting the
    # drop -- re-validate after any further change.
    full_lane_change_speed_cap_mps: 6.0
    # This governs the turn connector's own waypoint spacing (step_distance_m
    # = max(waypoint_turn_min_step_m, dt_s * this)), not a comfort
    # speed -- raising it alongside cruise speed widened the connector's
    # sampled path to ~0.5m/step, which cuts the inside of a tight turn
    # enough to push the swept vehicle envelope outside the drivable
    # corridor (confirmed: reverting this alone, independent of the
    # per-turn curvature cap below, fixed a right-turn scenario that got
    # permanently stuck mid-turn at 5.0). Keep this low so the connector
    # stays finely sampled regardless of how fast a turn is actually taken;
    # full_intersection_turn_speed_cap_mps governs the real comfort speed.
    waypoint_turn_speed_cap_mps: 2.2
    waypoint_turn_min_step_m: 0.35
    waypoint_turn_destination_arc_m: 4.5
    route_turn_connector_smoothing_passes: 16
    reference_contract_intersection_turn_max_curvature_1pm: 0.55
    reference_contract_turn_vehicle_footprint_enabled: true
    reference_contract_turn_boundary_margin_m: 0.15
    reference_contract_turn_max_boundary_failures: 1
    road_boundary_projection_max_heading_step_rad: 0.04
    road_boundary_projection_reset_distance_m: 2.5
    road_boundary_carla_drivable_footprint_enabled: true
    # One contract owns both stabilization entry and geometric completion.
    lane_change_stabilization_duration_s: 2.5
    lane_change_stabilization_speed_mps: 1.5
    lane_change_stabilization_timeout_frames: 100
    reference_vehicle_half_width_m: 1.07
    reference_vehicle_half_length_m: 2.45
    turn_swept_footprint_correction_padding_m: 0.05
    route_reference_boundary_aware: true
    route_reference_tracking_reserve_m: 0.20
    control_buffer_max_reference_anchor_jump_m: 0.75
    lane_change_completion_footprint_margin_m: 0.05
    # Defaults (0.35m / 8deg) let a lane change hand off to lane_follow with
    # residual error right at the tolerance edge, leaving lane_follow's own
    # centering controller to spend several extra seconds (and a visible
    # steering swing) cleaning it up right when the vehicle should already
    # look like it's driving a straight line. Tightening these makes the
    # lane-change reference tracker itself finish the convergence (it's
    # already actively driving toward the target lane center every tick;
    # this only delays the "complete" declaration, not how fast ego closes
    # the gap) before handing off.
    lane_change_completion_max_lateral_error_m: 0.20
    lane_change_completion_max_heading_error_deg: 5.0
    # Keep the turn reference through the outgoing-lane connector. Switching
    # to the stricter lane-follow contract after only 1 s exposed a local
    # curvature spike at the right-turn/straight-line join.
    scenario_turn_exit_hold_s: 3.0
    scenario_turn_exit_max_heading_error_rad: 0.15
    scenario_turn_exit_max_lateral_m: 0.75
    scenario_turn_exit_heading_lookahead_m: 5.0
    full_reference_stabilizer_min_forward_m: -0.25
    full_reference_stabilizer_min_spacing_m: 0.35
    full_reference_stabilizer_max_heading_step_rad: 0.75
    full_stop_reference_buffer_m: 1.5
    full_stop_reference_decel_mps2: 2.0
    full_stop_reference_speed_cap_mps: 2.0
    reference_contract_lane_follow_min_first_forward_m: 0.5
    reference_contract_lane_follow_max_first_lateral_abs_m: 0.75
    reference_contract_lane_follow_max_destination_lane_error_m: 0.75
    reference_contract_lane_follow_max_destination_body_lateral_abs_m: 1.5
    reference_contract_stop_min_first_forward_m: 0.2
    reference_contract_stop_max_first_lateral_abs_m: 0.75
    reference_contract_stop_max_destination_lane_error_m: 0.75
    reference_contract_stop_max_destination_body_lateral_abs_m: 1.5
    opencda_reference_recovery_speed_mps: 1.2
    record_debug: true
    record_evaluation_metrics: true
    record_collision_sensor: true
    debug_output_dir: opencda/planning_module/opencda_bridge/debug_intersection
    debug: true

# define the background traffic control by carla
carla_traffic_manager:
  random: true # whether to random select vehicles' color and model
  vehicle_list: ~  # a number or a list
  # Used only when vehicle_list is a number.
  # x_min, x_max, y_min, y_max, x_step, y_step, veh_num
  range:
    - [ 2, 10, 0, 200, 3.5, 25, 30]

# define scenario. In this scenario, a 4-vehicle platoon already exists.
scenario:
  max_ticks: 5000
  destination_tolerance_m: 3.0
  single_cav_list: # this is for merging vehicle or single cav without v2x
    - name: cav1
      spawn_position: [6.31, 125.03, 0.3, 0, -92, 0]
      # Keep the AD-map route on the southbound arterial. This endpoint is
      # beyond the third signalized intersection but before the later turn.
      destination: [6.31, -60.0, 0.3]
      v2x:
        communication_range: 60
      behavior:
        local_planner:
          debug_trajectory: true
          debug: true
      planner:
        enabled: true
        type: cpx_mpc
        mode: full_cpx_mpc
        fallback_policy: emergency_stop
        safety_supervisor_enabled: true
        safety_max_steer_delta: 0.25
        safety_max_throttle_delta: 0.45
        safety_max_brake_delta: 0.60
        safety_stuck_release_min_accel_mps2: 0.01
        use_opencda_global_route: true
        opencda_global_route_reference_allowed: true
        global_planner_mode: astar
        global_planner_xodr_path: Global_Planner/maps/Town06.xodr
        global_planner_strict: false
        publish_cp_message: true
        require_native_opencda_cp: true
        target_speed_mps: 3.0
        mpc_velocity_command_source: preview
        mpc_velocity_command_preview_time_s: 0.6
        actuator_compensation_enabled: true
        actuator_cruise_throttle_feedforward: 0.28
        actuator_cruise_max_throttle: 0.85
        actuator_speed_error_throttle_gain: 0.05
        actuator_max_speed_error_throttle_boost: 0.20
        actuator_speed_deadband_mps: 0.15
        actuator_tracking_brake_decel_per_unit_mps2: 14.0
        actuator_stop_brake_decel_per_unit_mps2: 10.0
        actuator_tracking_max_brake: 0.22
        actuator_stop_max_brake: 0.35
        actuator_max_measured_accel_abs_mps2: 3.0
        control_buffer_speed_crossing_deadband_mps: 0.15
        turn_drivable_union_seam_max_pose_violations: 3
        turn_drivable_union_seam_max_violation_ratio: 0.10
        actuator_measured_accel_alpha: 0.25
        lookahead_m: 18.0
        min_front_gap_m: 8.0
        communication_range_m: 60.0
        max_mpc_obstacles: 4
        route_reached_distance_m: 1.0
        tracker_max_stale_s: 0.5
        tracker_max_speed_mps: 45.0
        tracker_max_acceleration_mps2: 12.0
        tracker_max_position_jump_m: 12.0
        mpc_feedback_enabled: true
        mpc_feedback_hold_s: 1.5
        mpc_feedback_min_failures: 1
        mpc_feedback_candidate_weight: 80.0
        control_buffer_enabled: true
        control_buffer_max_reuse_s: 0.35
        overspeed_guard_enabled: true
        overspeed_margin_mps: 0.5
        overspeed_release_margin_mps: 0.1
        overspeed_decel_gain: 0.8
        overspeed_max_decel_mps2: 0.8
        lane_follow_negative_accel_release_enabled: false
        lane_follow_negative_accel_release_error_mps: 0.05
        lane_follow_negative_accel_release_min_front_gap_m: 12.0
        full_traffic_green_confirm_s: 0.15
        full_traffic_hold_stop_unknown_until_green: false
        full_stop_hold_speed_mps: 0.10
        full_stop_hold_brake: 0.60
        normal_stop_mpc_suspend_speed_mps: 0.30
        normal_stop_mpc_suspend_brake: 0.08
        lane_follow_speed_recovery_enabled: false
        lane_follow_speed_recovery_enter_error_mps: 0.20
        lane_follow_speed_recovery_release_error_mps: 0.05
        lane_follow_speed_recovery_min_accel_mps2: 0.80
        lane_follow_speed_recovery_max_lateral_m: 0.50
        low_speed_lateral_recovery_enabled: false
        low_speed_lateral_recovery_speed_mps: 0.8
        low_speed_lateral_recovery_threshold_m: 1.2
        low_speed_lateral_recovery_target_speed_mps: 1.0
        low_speed_lateral_recovery_max_steer_rad: 0.18
        full_lane_change_start_lock_s: 8.0
        full_dense_traffic_lane_change_lock_enabled: true
        full_dense_traffic_object_count: 8
        full_dense_traffic_risky_lane_count: 2
        full_prepare_lane_change_reference_lock: true
        full_allow_opportunistic_lane_change: false
        route_lane_change_preparation_start_distance_m: 45.0
        route_lane_change_latest_start_distance_m: 12.0
        route_lane_change_target_safety_threshold: 0.65
        route_lane_change_require_adjacent: true
        full_lane_follow_max_destination_lateral_m: 1.2
        full_lane_follow_max_reference_first_lateral_m: 0.65
