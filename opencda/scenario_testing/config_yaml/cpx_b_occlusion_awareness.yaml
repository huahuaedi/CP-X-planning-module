base_config: cpx_profile_full_default.yaml

description: |-
  CP-X use case B (geometric/line-of-sight occlusion), built on
  opencda/planning_module/carla_scenario/mdrive_unprotected_left_turn_1
  (Town05). cav1 is the primary ego making an unprotected left turn; a
  scripted oncoming vehicle (added to that legacy scenario's own yaml,
  `obstacles.npc_vehicles`, follow_mode: literal) drives the crossing
  direction cav1 must judge a gap in. cav2/cav3 are real "cooperative
  perception observer" CAVs parked further down that same road, added at
  runtime by this script's `configure_extra_cavs` callback, positioned to
  detect the oncoming vehicle earlier than cav1's own 50m ground-truth
  perception radius would allow.

vehicle_base:
  planner:
    global_planner_xodr_path: Global_Planner/maps/Town05.xodr
    debug_output_dir: opencda/planning_module/opencda_bridge/debug_cpx_b_occlusion_awareness
    communication_range_m: 60.0
    cp_visibility_filter_enabled: true
    cp_visibility_backend: actor_geometry
    cp_visibility_sensor_height_m: 1.6
    cp_visibility_target_tolerance_m: 0.75

# spawn_position/destination below are placeholders overwritten at runtime by
# cpx_scenario_bridge from the legacy scenario's own anchor markers.
scenario:
  max_ticks: 5000
  destination_tolerance_m: 4.0
  single_cav_list:
    - name: cav1
      spawn_position: [0.0, 0.0, 0.3, 0, 0, 0]
      destination: [0.0, 0.0, 0.3]
      v2x:
        communication_range: 60
