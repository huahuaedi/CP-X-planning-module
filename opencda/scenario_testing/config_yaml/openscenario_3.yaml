description: |-
  Author: Wei Shao <phdweishao@gmail.com>
  Content: Test configurations for `openscenario_carla` that incorporates ScenarioRunner

# Parameters needed for ScenarioRunner
scenario_runner:
  town: town03
  scenario: Scenario_3
  num_actors: 2
  configFile: './opencda/scenario_testing/scenarios/scenario_3.xml'
  additionalScenario: './opencda/scenario_testing/scenarios/scenario_3.py'
  host: localhost
  port: 2000
  timeout: 10
  debug: false
  sync: false
  repetitions: 1
  agent: null
  openscenario: null
  openscenario2: null
  route: null
  route_id: ''
  reloadWorld: false
  waitForEgo: false
  trafficManagerPort: '8000'
  trafficManagerSeed: '0'
  record: ''
  agentConfig: ''
  file: false
  json: false
  junit: false
  list: false
  openscenarioparams: null
  output: false
  outputDir: ''
  randomize: false
  frameRate: 20

# Define OpenCDA scenario
scenario:
  single_cav_list:
    - name: ego
      destination: [-38.8, 134.7, 0.5]
      v2x:
        enabled: true
      behavior:
        local_planner:
          debug_trajectory: false
          debug: false
    - name: cav_1
      destination: [-28.8, 137.7, 0.5] # TODO: needs change
      v2x:
        enabled: true
      behavior:
        local_planner:
          debug_trajectory: false
          debug: false

vehicle_base:
  sensing:
    perception:
      lidar:
        visualize: true
  behavior:
    max_speed: 20
    local_planner:
      debug_trajectory: false
      debug: false