base_config: cpx_two_cav_merge_conflict.yaml

description: |-
  Real-MTR four-CAV validation. Same opposing lane-exchange as
  cpx_three_cav_merge_mtr_multimodal (cav1 lane 8.3->4.8, cav2 lane
  4.8->8.3, cav3 a through vehicle staying in lane 4.8), plus a fourth CAV
  (cav4) that stays in lane 8.3 the whole route -- the symmetric through
  vehicle for cav2's merge target and cav1's vacated lane. First closed-loop
  4-CAV data point for the multimodal integration review's point 6
  (relevant-agent budget is 6, mode budget is 3/agent -- four real CAVs
  plus each other's broadcast intents stays inside both, but this is the
  first run that actually reaches that count).

  Experiment completion is separated from the planner's final stopping point.
  Each CAV must cross its configured completion_destination, while its actual
  route continues to x=100 m. This keeps every participant moving until all
  four have cleared the merge and prevents a completed vehicle from becoming
  a parked roadblock when the valid merge order changes between trials. No
  planner or controller thresholds are changed.

# Four cooperative vehicles need a longer observation window than the
# inherited two-CAV experiment.  At the former 1800-tick limit, cav3 and cav4
# were still moving normally with 51 m and 40 m remaining; this is a test
# truncation, not a stuck-planner condition.  Match the validated three-CAV
# window while leaving every planner and vehicle parameter unchanged.
cpx_mature:
  max_ticks: 3200

vehicle_base:
  planner:
    use_mtr_prediction_bridge: true
    mtr_prediction_server_url: "http://127.0.0.1:8765"
    mtr_prediction_update_hz: 5.0
    mtr_prediction_max_stale_s: 0.6
    prediction_mode_min_probability: 0.05
    prediction_credible_probability_min: 0.15
    prediction_credible_ttc_s: 2.0

# Lists are repeated because OmegaConf replaces them wholesale.
scenario:
  single_cav_list:
    - name: cav1
      spawn_position: [-300.0, 8.3, 0.3, 0, 0, 0]
      destination: [100.0, 4.8, 0.3]
      completion_destination: [-70.0, 4.8, 0.3]
      v2x:
        enabled: true
        communication_range: 80
      behavior:
        local_planner:
          debug_trajectory: true
          debug: true
      planner:
        target_speed_mps: 8.0
        debug_output_dir: artifacts/debug/four_cav_merge_mtr_cav1

    - name: cav2
      spawn_position: [-306.0, 4.8, 0.3, 0, 0, 0]
      destination: [100.0, 8.3, 0.3]
      completion_destination: [-76.0, 8.3, 0.3]
      v2x:
        enabled: true
        communication_range: 80
      behavior:
        local_planner:
          debug_trajectory: true
          debug: true
      planner:
        target_speed_mps: 8.0
        debug_output_dir: artifacts/debug/four_cav_merge_mtr_cav2

    - name: cav3
      # Through vehicle in lane 4.8. The actual route continues beyond its
      # experiment-completion checkpoint.
      spawn_position: [-318.0, 4.8, 0.3, 0, 0, 0]
      destination: [100.0, 4.8, 0.3]
      completion_destination: [-82.0, 4.8, 0.3]
      v2x:
        enabled: true
        communication_range: 80
      behavior:
        local_planner:
          debug_trajectory: true
          debug: true
      planner:
        target_speed_mps: 7.0
        debug_output_dir: artifacts/debug/four_cav_merge_mtr_cav3

    - name: cav4
      # Through vehicle in lane 8.3. Its planner destination remains farther
      # downstream so it never parks in cav2's route during the experiment.
      spawn_position: [-312.0, 8.3, 0.3, 0, 0, 0]
      destination: [100.0, 8.3, 0.3]
      completion_destination: [-64.0, 8.3, 0.3]
      v2x:
        enabled: true
        communication_range: 80
      behavior:
        local_planner:
          debug_trajectory: true
          debug: true
      planner:
        target_speed_mps: 7.0
        debug_output_dir: artifacts/debug/four_cav_merge_mtr_cav4
