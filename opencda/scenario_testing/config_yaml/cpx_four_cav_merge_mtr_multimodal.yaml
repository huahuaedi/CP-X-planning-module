base_config: cpx_two_cav_merge_conflict.yaml

description: |-
  Real-MTR four-CAV validation. Same opposing lane-exchange as
  cpx_three_cav_merge_mtr_multimodal (cav1 lane 8.3->4.8, cav2 lane
  4.8->8.3, cav3 a through vehicle staying in lane 4.8), plus a fourth CAV
  (cav4) that stays in lane 8.3 the whole route -- the symmetric through
  vehicle for cav2's merge target and cav1's vacated lane. First closed-loop
  4-CAV data point for the multimodal integration review's point 6
  (relevant-agent budget is 6, mode budget is 3/agent -- four real CAVs
  plus each other's broadcast intents stays inside both, but this is the
  first run that actually reaches that count).

  Both through vehicles' destinations are short of the merging CAV that
  parks in their own lane (cav3 short of cav1's stop point, cav4 short of
  cav2's), the same fix cpx_three_cav_merge_mtr_multimodal needed: with
  opportunistic lane change disabled for this experiment, a destination past
  a parked lead in the same lane is a physically blocked route, not a
  planner question.

vehicle_base:
  planner:
    use_mtr_prediction_bridge: true
    mtr_prediction_server_url: "http://127.0.0.1:8765"
    mtr_prediction_update_hz: 5.0
    mtr_prediction_max_stale_s: 0.6
    prediction_mode_min_probability: 0.05
    prediction_credible_probability_min: 0.15
    prediction_credible_ttc_s: 2.0

# Lists are repeated because OmegaConf replaces them wholesale.
scenario:
  single_cav_list:
    - name: cav1
      spawn_position: [-300.0, 8.3, 0.3, 0, 0, 0]
      destination: [-70.0, 4.8, 0.3]
      v2x:
        enabled: true
        communication_range: 80
      behavior:
        local_planner:
          debug_trajectory: true
          debug: true
      planner:
        target_speed_mps: 8.0
        debug_output_dir: opencda/planning_module/opencda_bridge/debug_four_cav_merge_mtr_cav1

    - name: cav2
      spawn_position: [-306.0, 4.8, 0.3, 0, 0, 0]
      destination: [-76.0, 8.3, 0.3]
      v2x:
        enabled: true
        communication_range: 80
      behavior:
        local_planner:
          debug_trajectory: true
          debug: true
      planner:
        target_speed_mps: 8.0
        debug_output_dir: opencda/planning_module/opencda_bridge/debug_four_cav_merge_mtr_cav2

    - name: cav3
      # Through vehicle in lane 4.8, destination short of cav1's stop point
      # in the same lane (x=-70).
      spawn_position: [-318.0, 4.8, 0.3, 0, 0, 0]
      destination: [-82.0, 4.8, 0.3]
      v2x:
        enabled: true
        communication_range: 80
      behavior:
        local_planner:
          debug_trajectory: true
          debug: true
      planner:
        target_speed_mps: 7.0
        debug_output_dir: opencda/planning_module/opencda_bridge/debug_four_cav_merge_mtr_cav3

    - name: cav4
      # Through vehicle in lane 8.3, destination short of cav2's stop point
      # in the same lane (x=-76). Staggered spawn from cav1/cav3 so all four
      # are not aligned on the same starting line.
      spawn_position: [-312.0, 8.3, 0.3, 0, 0, 0]
      destination: [-88.0, 8.3, 0.3]
      v2x:
        enabled: true
        communication_range: 80
      behavior:
        local_planner:
          debug_trajectory: true
          debug: true
      planner:
        target_speed_mps: 7.0
        debug_output_dir: opencda/planning_module/opencda_bridge/debug_four_cav_merge_mtr_cav4
