base_config: single_intersection_town06_carla.yaml

description: |-
  Town06 single-CAV route-required lane-change and right-turn validation.
  The CARLA Global Route requires CHANGELANERIGHT before the intersection and
  then follows the continuous RIGHT-turn connector onto the outgoing road.
  Background traffic is inherited from single_intersection_town06_carla.

scenario:
  max_ticks: 5000
  destination_tolerance_m: 3.0
  single_cav_list:
    - name: cav1
      spawn_position: [6.31, 125.03, 0.3, 0, -92, 0]
      # Previously used by single_intersection_town06_carla. CARLA GRP route:
      # LANEFOLLOW -> CHANGELANERIGHT -> LANEFOLLOW -> RIGHT -> LANEFOLLOW.
      destination: [50.0, 52.38, 0.3]
      v2x:
        communication_range: 60
      behavior:
        local_planner:
          debug_trajectory: true
          debug: true
      planner:
        debug_output_dir: opencda/planning_module/opencda_bridge/debug_single_right_lane_turn
