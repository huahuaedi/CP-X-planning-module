base_config: cpx_profile_full_default.yaml

description: |-
  Ported from opencda/planning_module/carla_scenario/mdrive_unprotected_left_turn_1 so it runs
  through the official `python opencda.py -t cpx_mdrive_unprotected_left_turn_1` entry point instead of the
  standalone opencda/planning_module/main.py runner. World bootstrapping (obstacle/
  marker spawning, SUMO co-simulation, scripted traffic lights, proactive CP messages)
  is still provided by the original scenario module via
  opencda.scenario_testing.utils.cpx_scenario_bridge -- only the drive loop now goes
  through OpenCDA's native VehicleManager / CPXMPCPlannerBridge pipeline.
#
# CP-X use case B (geometric/line-of-sight occlusion): the source scenario had no
# obstacles block at all (no actual turn conflict); an oncoming vehicle was added
# to opencda/planning_module/carla_scenario/mdrive_unprotected_left_turn_1/
# mdrive_unprotected_left_turn_1.yaml -- see that file's inline NOTE for the
# unverified geometry/timing assumptions.

# Only override what genuinely differs from cpx_profile_full_default.yaml.
vehicle_base:
  planner:
    global_planner_xodr_path: Global_Planner/maps/Town05.xodr
    debug_output_dir: opencda/planning_module/opencda_bridge/debug_cpx_mdrive_unprotected_left_turn_1

# spawn_position/destination below are placeholders overwritten at runtime by
# cpx_scenario_bridge from the legacy scenario's own anchor markers (marker
# positions live in the CARLA map/level, not in any yaml, so they cannot be
# resolved statically).
scenario:
  single_cav_list:
    - name: cav1
      spawn_position: [0.0, 0.0, 0.3, 0, 0, 0]
      destination: [0.0, 0.0, 0.3]
      v2x:
        communication_range: 45
