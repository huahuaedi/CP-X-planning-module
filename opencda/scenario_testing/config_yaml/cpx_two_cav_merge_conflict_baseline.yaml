base_config: cpx_two_cav_merge_conflict.yaml

description: |-
  Baseline for cpx_two_cav_merge_conflict: identical overtake-into-moving-
  traffic layout with the multi-CAV interaction pipeline OFF
  (cav_conflict_enabled: false). cav2 then plans its merge treating cav1 as an
  ordinary exponential-potential obstacle at its current pose -- no
  classify / assign / predicted-station corridor / keep-out QP rows.

  Run both and diff with opencda/scenario_testing/compare_cav_interaction.py.

vehicle_base:
  planner:
    cav_conflict_enabled: false

# OmegaConf replaces lists wholesale, so the blocker and both CAVs must be
# repeated here; only cav_conflict_enabled and the debug dirs differ.
carla_traffic_manager:
  vehicle_list:
    - spawn_position: [-180.0, 8.3, 0.3, 0, 0, 0]
      vehicle_speed_perc: 95

scenario:
  single_cav_list:
    - name: cav1
      spawn_position: [-300.0, 4.8, 0.3, 0, 0, 0]
      destination: [350.0, 4.8, 0.3]
      v2x:
        enabled: true
        communication_range: 80
      behavior:
        local_planner:
          debug_trajectory: true
          debug: true
      planner:
        target_speed_mps: 10.0
        debug_output_dir: opencda/planning_module/opencda_bridge/debug_two_cav_merge_off_cav1

    - name: cav2
      spawn_position: [-340.0, 8.3, 0.3, 0, 0, 0]
      destination: [350.0, 8.3, 0.3]
      v2x:
        enabled: true
        communication_range: 80
      behavior:
        local_planner:
          debug_trajectory: true
          debug: true
      planner:
        target_speed_mps: 14.0
        debug_output_dir: opencda/planning_module/opencda_bridge/debug_two_cav_merge_off_cav2
