base_config: cpx_two_cav_merge_conflict.yaml

description: |-
  Same two-CAV freeway merge as cpx_two_cav_merge_conflict but with the
  interaction pipeline OFF: each CAV plans as if the other were an ordinary
  obstacle (exponential repulsive potential only -- no classify / assign /
  corridor / keep-out QP rows). Run both and diff with
  opencda/scenario_testing/compare_cav_interaction.py.

vehicle_base:
  planner:
    cav_conflict_enabled: false

scenario:
  single_cav_list:
    - name: cav1
      spawn_position: [-320.0, 4.8, 0.3, 0, 0, 0]
      destination: [650.0, 8.3, 0.3]
      v2x:
        enabled: true
        communication_range: 80
      behavior:
        local_planner:
          debug_trajectory: true
          debug: true
      planner:
        debug_output_dir: opencda/planning_module/opencda_bridge/debug_two_cav_merge_off_cav1

    - name: cav2
      spawn_position: [-330.0, 4.8, 0.3, 0, 0, 0]
      destination: [650.0, 8.3, 0.3]
      v2x:
        enabled: true
        communication_range: 80
      behavior:
        local_planner:
          debug_trajectory: true
          debug: true
      planner:
        debug_output_dir: opencda/planning_module/opencda_bridge/debug_two_cav_merge_off_cav2
