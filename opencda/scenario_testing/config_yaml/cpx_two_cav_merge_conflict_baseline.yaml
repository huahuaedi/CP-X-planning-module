base_config: cpx_two_cav_merge_conflict.yaml

description: |-
  Physical-control baseline for cpx_two_cav_merge_conflict. It inherits the
  same CAV spawns, slow traffic vehicle, destinations and lane-change policy;
  only the prediction-aware cooperative conflict pipeline is OFF
  (cav_conflict_enabled: false). Peers therefore create no role assignment,
  predicted-station corridor, or QP homotopy half-space.

  Run both and export evidence with
  opencda/scenario_testing/export_cav_interaction_report.py.

vehicle_base:
  planner:
    cav_conflict_enabled: false

# OmegaConf replaces lists wholesale, so both CAVs must be repeated here;
# only cav_conflict_enabled and the debug dirs differ.
scenario:
  single_cav_list:
    - name: cav1
      spawn_position: [-300.0, 8.3, 0.3, 0, 0, 0]
      destination: [-70.0, 8.3, 0.3]
      v2x:
        enabled: true
        communication_range: 80
      behavior:
        local_planner:
          debug_trajectory: true
          debug: true
      planner:
        target_speed_mps: 8.0
        debug_output_dir: opencda/planning_module/opencda_bridge/debug_two_cav_merge_off_cav1

    - name: cav2
      spawn_position: [-325.0, 8.3, 0.3, 0, 0, 0]
      destination: [-70.0, 8.3, 0.3]
      v2x:
        enabled: true
        communication_range: 80
      behavior:
        local_planner:
          debug_trajectory: true
          debug: true
      planner:
        target_speed_mps: 10.0
        debug_output_dir: opencda/planning_module/opencda_bridge/debug_two_cav_merge_off_cav2
