base_config: cpx_lane_change_2lanefree.yaml

description: |-
  ============================================================================
  Two-CAV overtake-into-moving-traffic conflict, on 2lane_freeway_simplified.
  Purpose: validate that consuming the OTHER CAV's predicted trajectory
  (its broadcast MPC plan) produces a safer merge than treating it as a
  bare current-position obstacle.
  ============================================================================

  Layout (straight freeway, travel +x):
    main lane      y = 8.3
    passing lane   y = 4.8

    cav2  spawn (-340, 8.3)  dest (350, 8.3)  target 14 m/s   -- the merging car
    cav1  spawn (-300, 8.3)  ... no: cav1 is in the PASSING lane:
    cav1  spawn (-300, 4.8)  dest (350, 4.8)  target 10 m/s   -- cruises straight, never maneuvers
    blocker  (-180, 8.3)  ~1 m/s  -- forces cav2 to detour into the passing lane

  Only cav1 sits in the passing lane. cav2, cruising the main lane at 14 m/s,
  catches the crawling blocker near x = -190 and must do the behavior-planner
  safety-score detour into the passing lane to get around it -- exactly where
  cav1 is cruising ~20 m ahead at 10 m/s. cav2 is closing at ~4 m/s, so it
  cannot simply pull out level with cav1; it has to size the gap against where
  cav1 WILL be.

  cav_conflict_enabled = true  (this file):
    Stage A tags cav1 as FOLLOW / CUT_IN in cav2's target lane.
    Stage C caps cav2's corridor s_hi one RSS gap behind cav1's *projected*
      station (from cav1's broadcast plan), so cav2 bleeds to ~10 m/s BEFORE
      it crosses the lane line and slots in cleanly behind cav1.
  cpx_two_cav_merge_conflict_baseline (cav_conflict_enabled = false):
    cav1 is only an exponential-potential obstacle at its current pose, so cav2
    merges at 14 m/s, closes on cav1 in-lane, then hard-brakes / triggers
    fallback. Diff the two with compare_cav_interaction.py.

  Single maneuvering vehicle, 14 m/s (cpx_lane_change_speed_15 proves the LC
  MPC is stable at 15) -- deliberately NOT the earlier "both CAVs change lanes
  around the same blocker at 20 m/s", which over-constrained the QP (blocker
  keep-out + road boundary + peer corridor) and deadlocked both cars straddling
  the lane line.

cpx_mature:
  max_ticks: 1500
  destination_tolerance_m: 6.0

vehicle_base:
  behavior:
    max_speed: 90
    ignore_traffic_light: true
    overtake_allowed: true
  planner:
    full_lane_change_dynamic_speed_cap_enabled: true
    full_lane_change_speed_ceiling_mps: 14.0
    full_allow_opportunistic_lane_change: true
    # master switch: peer intents -> classify -> assign -> corridor -> QP row.
    # Also flips MPC.corridor_constraint_enabled on at bridge construction.
    cav_conflict_enabled: true

# One crawling blocker in the MAIN lane; only cav2 (main lane) must detour.
carla_traffic_manager:
  vehicle_list:
    - spawn_position: [-180.0, 8.3, 0.3, 0, 0, 0]
      vehicle_speed_perc: 95

scenario:
  single_cav_list:
    # cav1: cruises the passing lane at 10 m/s. Never changes lane. It is the
    # moving obstacle cav2 must merge behind.
    - name: cav1
      spawn_position: [-300.0, 4.8, 0.3, 0, 0, 0]
      destination: [350.0, 4.8, 0.3]
      v2x:
        enabled: true
        communication_range: 80
      behavior:
        local_planner:
          debug_trajectory: true
          debug: true
      planner:
        target_speed_mps: 10.0
        debug_output_dir: opencda/planning_module/opencda_bridge/debug_two_cav_merge_cav1

    # cav2: main lane at 14 m/s, catches the blocker, detours into the passing
    # lane where cav1 is. This is the car whose merge quality we measure.
    - name: cav2
      spawn_position: [-340.0, 8.3, 0.3, 0, 0, 0]
      destination: [350.0, 8.3, 0.3]
      v2x:
        enabled: true
        communication_range: 80
      behavior:
        local_planner:
          debug_trajectory: true
          debug: true
      planner:
        target_speed_mps: 14.0
        debug_output_dir: opencda/planning_module/opencda_bridge/debug_two_cav_merge_cav2
