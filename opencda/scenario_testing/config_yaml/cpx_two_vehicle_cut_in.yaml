base_config: cpx_lane_change_2lanefree.yaml

description: |-
  Deterministic CUT_IN validation. One ego CAV follows the right lane while
  an ego-blind scripted vehicle moves from the adjacent lane into its path.

cpx_mature:
  max_ticks: 700
  destination_tolerance_m: 6.0

carla_traffic_manager:
  vehicle_list: []
  range: ~

vehicle_base:
  behavior:
    ignore_traffic_light: true
    overtake_allowed: false
  planner:
    cav_conflict_enabled: true
    # CUT_IN owns the transition corridor; after it settles to FOLLOW, the
    # normal speed owner resumes safe car-following.
    following_idm_enabled: true
    full_allow_opportunistic_lane_change: false
    record_evaluation_metrics: true
    # Preserve the scripted actor's measured lateral velocity. Lane-follow
    # projection would erase the very cut-in this fixture is meant to test.
    prediction_lane_following_enabled: false
    debug_log_formats: [jsonl]

scenario:
  single_cav_list:
    - name: cut_in_ego
      spawn_position: [-300.0, 8.3, 0.3, 0, 0, 0]
      destination: [-90.0, 8.3, 0.3]
      v2x:
        enabled: true
        communication_range: 80
      planner:
        target_speed_mps: 10.0
        debug_output_dir: opencda/planning_module/opencda_bridge/debug_conflict_cut_in
  scripted_actors:
    - blueprint: vehicle.tesla.model3
      path:
        - [-270.0, 4.8]
        - [-255.0, 4.8]
        - [-235.0, 8.3]
        - [-90.0, 8.3]
      speed_mps: 8.0
      # Put the lateral crossing inside the ego MPC reference horizon. An
      # earlier start completes the manoeuvre beyond the finite reference and
      # only tests the later FOLLOW phase.
      start_tick: 90
      z: 0.3
