description: |-
  Author: Wei Shao <phdweishao@gmail.com>
  Content: Test configurations for `openscenario_carla` that incorporates ScenarioRunner

# Parameters needed for ScenarioRunner
scenario_runner:
  town: town01
  scenario: Scenario_1
  num_actors: 2
  configFile: './opencda/scenario_testing/scenarios/scenario_1.xml'
  additionalScenario: './opencda/scenario_testing/scenarios/scenario_1.py'
  host: localhost
  port: 2000
  timeout: 10
  debug: false
  sync: false
  repetitions: 1
  agent: null
  openscenario: null
  openscenario2: null
  route: null
  route_id: ''
  reloadWorld: false
  waitForEgo: false
  trafficManagerPort: '8000'
  trafficManagerSeed: '0'
  record: ''
  agentConfig: ''
  file: false
  json: false
  junit: false
  list: false
  openscenarioparams: null
  output: false
  outputDir: ''
  randomize: false
  frameRate: 20

# Define OpenCDA scenario
scenario:
  single_cav_list:
    - name: ego
      destination: [200.2, 195.4, 0.5]
      v2x:
        enabled: false
      behavior:
        local_planner:
          debug_trajectory: true
          debug: false

vehicle_base:
  sensing:
    perception:
      lidar:
        visualize: true
