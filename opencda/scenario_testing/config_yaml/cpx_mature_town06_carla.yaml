description: |-
  CP-X integration on OpenCDA's mature single_town06_carla layout.

cpx_mature:
  map_mode: town
  town: Town06
  max_ticks: 1000
  destination_tolerance_m: 10.0
  run_opencda_evaluation: false

vehicle_base:
  sensing:
    perception:
      activate: false
      camera:
        visualize: 0
        num: 0
        positions: []
      lidar:
        visualize: false
    localization:
      activate: false
      debug_helper:
        show_animation: false
  map_manager:
    visualize: false
    activate: false
  behavior:
    max_speed: 35
    ignore_traffic_light: false
    overtake_allowed: false
    collision_time_ahead: 2.0
    local_planner:
      debug: true
      debug_trajectory: true
  planner:
    enabled: true
    type: cpx_mpc
    mode: full_cpx_mpc
    fallback_policy: emergency_stop
    target_speed_mps: 4.0
    lookahead_m: 18.0
    min_front_gap_m: 8.0
    max_mpc_obstacles: 4
    record_debug: true
    debug_output_dir: opencda/planning_module/opencda_bridge/debug_mature_town06
    debug: true

carla_traffic_manager:
  random: true
  ignore_lights_percentage: 0
  vehicle_list: ~
  range:
    - [ 50, 250, 135, 145, 50, 4, 30]

scenario:
  single_cav_list:
    - name: cav1
      spawn_position: [47.7194, 139.51, 0.3, 0, 0, 0]
      destination: [600, 145.51, 0.3]
      v2x:
        communication_range: 45
      behavior:
        local_planner:
          debug_trajectory: true
          debug: true
