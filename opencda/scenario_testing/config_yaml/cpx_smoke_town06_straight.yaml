description: |-
  CP-X deterministic smoke test: Town06 straight lane following.

vehicle_base:
  sensing:
    perception:
      activate: false
      camera:
        visualize: 0
        num: 0
        positions: []
      lidar:
        visualize: false
    localization:
      activate: false
      debug_helper:
        show_animation: false
  map_manager:
    visualize: false
    activate: false
  behavior:
    max_speed: 30
    ignore_traffic_light: true
    overtake_allowed: false
    collision_time_ahead: 1.5
    local_planner:
      debug: true
      debug_trajectory: true
  planner:
    enabled: true
    type: cpx_mpc
    mode: full_cpx_mpc
    fallback_policy: emergency_stop
    safety_supervisor_enabled: true
    use_opencda_global_route: true
    opencda_global_route_reference_allowed: true
    global_planner_mode: dij
    global_planner_xodr_path: Global_Planner/maps/Town06.xodr
    global_planner_strict: false
    target_speed_mps: 3.5
    lookahead_m: 18.0
    min_front_gap_m: 8.0
    max_mpc_obstacles: 0
    full_allow_opportunistic_lane_change: false
    full_candidate_pipeline_enabled: true
    full_reference_memory_enabled: true
    full_trajectory_memory_enabled: true
    full_intersection_turn_prepare_enabled: false
    traffic_stop_approach_far_speed_cap_mps: 3.5
    traffic_stop_approach_near_speed_cap_mps: 2.5
    record_debug: true
    debug_output_dir: opencda/planning_module/opencda_bridge/debug_smoke_straight
    debug: true

carla_traffic_manager:
  vehicle_list: []
  range: []

cpx_smoke:
  max_ticks: 700
  destination_tolerance_m: 6.0

scenario:
  single_cav_list:
    - name: cav1
      spawn_position: [47.7194, 139.51, 0.3, 0, 0, 0]
      destination: [160.0, 139.51, 0.3]
      v2x:
        communication_range: 45
